name: Backend CI/CD Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    # Database PostgreSQL reale per supportare tipi ARRAY, pg_trgm e le migrazioni Alembic
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: zerobuff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@127.0.0.1:5432/zerobuff_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@127.0.0.1:5432/zerobuff_test
          SECRET_KEY: test-secret-key-entropy-for-ci-minimum-32-chars-long
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 120
        run: uv run pytest -v --disable-warnings

  deploy:
    name: Trigger Production Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Call Deploy Webhook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering cloud deploy..."
            curl -f -s -X POST "$DEPLOY_HOOK_URL"
            echo "Deploy triggered successfully."
          else
            echo "Nessun DEPLOY_HOOK_URL impostato nei secrets di GitHub. Skip del trigger."
          fi
