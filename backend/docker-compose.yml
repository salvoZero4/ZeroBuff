services:
  db:
    image: postgres:18-alpine
    container_name: gym_app_db
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gym_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  db_test:
    image: postgres:18-alpine
    container_name: gym_app_db_test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gym_db_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql

volumes:
  postgres_data:
    name: gym-app-volume
