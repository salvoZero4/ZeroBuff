services:
  db:
    image: postgres:18-alpine
    container_name: zerobuff_db
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zerobuff_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  db_test:
    image: postgres:18-alpine
    container_name: zerobuff_db_test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zerobuff_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql

  backend:
    build: .
    container_name: zerobuff_backend
    restart: no
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-zerobuff_db}
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db_test:5432/zerobuff_test

    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - db

volumes:
  postgres_data:
    name: zerobuff-volume
